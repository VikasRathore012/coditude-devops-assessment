version: 0.0
os: linux
files:
- source: /
  destination: /opt/assessment/incoming
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
  - location: hooks/stop.sh
    timeout: 60
    runas: root
  BeforeInstall:
  - location: hooks/before.sh
    timeout: 60
    runas: root
  AfterInstall:
  - location: hooks/install.sh
    timeout: 600
    runas: root
  ApplicationStart:
  - location: hooks/start.sh
    timeout: 60
    runas: root
  ValidateService:
  - location: hooks/validate.sh
    timeout: 120
    runas: root
