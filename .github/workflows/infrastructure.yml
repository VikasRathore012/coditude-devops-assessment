name: Infrastructure validation and reviewed change sets
on:
  pull_request:
    paths: ['infra/**', 'scripts/infra_change_set.py', 'scripts/apply_change_set.py', 'scripts/validate_repository.py', '.github/workflows/infrastructure.yml']
  push:
    branches: [main, staging, production]
    paths: ['infra/**', 'scripts/infra_change_set.py', 'scripts/apply_change_set.py', 'scripts/validate_repository.py', '.github/workflows/infrastructure.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        default: dev
      component:
        type: choice
        options: [foundation, ecs, ec2]
        default: foundation
      operation:
        type: choice
        options: [plan, apply]
        default: plan
      change_set_arn:
        description: Exact reviewed ARN from a successful plan (apply only)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: cfn-lint -t infra/*.yaml
      - run: python scripts/validate_repository.py
  change-set:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: infra-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m pip install boto3
      - name: Create reviewed change set
        if: inputs.operation == 'plan'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
          EXECUTION_ROLE: ${{ vars.CFN_EXECUTION_ROLE_ARN }}
        run: python scripts/infra_change_set.py --environment "$ENVIRONMENT" --component "$COMPONENT" --execution-role "$EXECUTION_ROLE"
      - name: Apply exact approved change set and wait
        if: inputs.operation == 'apply'
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
          EXPECTED_STACK: coditude-${{ inputs.environment }}-${{ inputs.component }}
        run: python scripts/apply_change_set.py
