name: Application build and release
on:
  pull_request:
    paths: ['apps/**', 'deploy/**', 'scripts/deploy_app.py', 'scripts/rollback.py', 'scripts/smoke_frontend.py', 'tests/**', 'requirements-dev.txt', '.github/workflows/application.yml']
  push:
    branches: [main, staging, production]
    paths: ['apps/**', 'deploy/**', 'scripts/deploy_app.py', 'scripts/rollback.py', 'scripts/smoke_frontend.py', 'tests/**', 'requirements-dev.txt', '.github/workflows/application.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: python -m pip install -r apps/backend/requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: npm ci && npm run build
        working-directory: apps/frontend
      - run: python scripts/smoke_frontend.py
  release:
    needs: test
    if: github.event_name != 'pull_request' && vars.DEPLOY_DRIVER == 'github'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m pip install -r apps/backend/requirements.txt
      - name: Deploy applications only
        env:
          FOUNDATION_STACK: ${{ vars.FOUNDATION_STACK }}
          RUNTIME_STACK: ${{ vars.RUNTIME_STACK }}
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE }}
          APP_URL: ${{ vars.APP_URL }}
          REVISION: ${{ github.sha }}
        run: python scripts/deploy_app.py --foundation "$FOUNDATION_STACK" --runtime "$RUNTIME_STACK" --mode "$DEPLOY_MODE" --revision "$REVISION" --url "$APP_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: dist/release.json
          if-no-files-found: error
