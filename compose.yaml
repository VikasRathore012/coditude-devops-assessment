services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?copy .env.example to .env}
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U assessment -d assessment
      interval: 5s
      retries: 10
  backend:
    build: ./apps/backend
    environment:
      APP_ENV: local
      DB_HOST: database
      DB_USER: assessment
      DB_NAME: assessment
      DB_PASSWORD: ${LOCAL_DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./apps/frontend
  gateway:
    image: nginx:stable-alpine
    ports:
    - 127.0.0.1:8080:80
    volumes:
    - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - frontend
    - backend
volumes:
  pgdata: {}
