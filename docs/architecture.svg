<polygon points="1260,260 1265.2195864093349,270.8053652282321 1254.7804135906651,270.8053652282321" fill="#546b87"/>
<rect x="50" y="325" width="1500" height="650" rx="14" fill="#e9eff8" stroke="#9bb0cc" stroke-width="2"/>
<text x="70" y="362" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">AWS VPC  •  Two Availability Zones</text>
<rect x="90" y="390" width="340" height="145" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="110" y="427" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">Public subnets</text>
<text x="110" y="459" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">HTTPS ALB + ACM certificate</text>
<text x="110" y="487" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">HTTP → HTTPS redirect</text>
<text x="110" y="515" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">NAT per AZ in production</text>
<rect x="490" y="390" width="580" height="200" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="510" y="427" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">Option A — ECS Fargate</text>
<text x="510" y="459" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Private Next.js service :3000</text>
<text x="510" y="487" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Private Python service :8000</text>
<text x="510" y="515" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Independent scaling; min. 2 replicas each</text>
<text x="510" y="543" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Image digests; rolling release + circuit breaker</text>
<rect x="490" y="650" width="580" height="200" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="510" y="687" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">Option B — EC2 Auto Scaling</text>
<text x="510" y="719" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Private fleet across both AZs</text>
<text x="510" y="747" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Node.js + Python systemd processes</text>
<text x="510" y="775" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">CodeDeploy drains traffic, one host at a time</text>
<text x="510" y="803" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">IMDSv2; SSM access; no public IP / SSH</text>
<rect x="1140" y="500" width="365" height="150" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="1160" y="537" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">Isolated DB subnets</text>
<text x="1160" y="569" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">RDS PostgreSQL 17</text>
<text x="1160" y="597" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Multi-AZ + backups in prod</text>
<text x="1160" y="625" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">TLS; only app SG on 5432</text>
<rect x="1140" y="700" width="365" height="120" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="1160" y="737" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">Secrets Manager</text>
<text x="1160" y="769" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Dedicated application DB login</text>
<text x="1160" y="797" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Separate admin bootstrap</text>
<rect x="90" y="640" width="340" height="180" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="110" y="677" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">CloudWatch + SNS</text>
<text x="110" y="709" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Application / system logs</text>
<text x="110" y="737" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Unhealthy targets and 5xx</text>
<text x="110" y="765" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">RDS storage; VPC reject logs</text>
<text x="110" y="793" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Alert email confirmation</text>
<text x="98" y="583" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="700">Routing: / → Next.js</text>
<text x="98" y="613" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="700">/api/* → Python</text>
