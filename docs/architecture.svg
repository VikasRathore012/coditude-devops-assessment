<text x="93" y="903" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#263750" font-weight="400">Production: two NAT gateways + Multi-AZ database. Dev/staging: one NAT + single-AZ database.</text>
<text x="93" y="937" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#263750" font-weight="400">Application roles explicitly deny CloudFormation writes. Infrastructure changes preserve running image digests.</text>
<text x="50" y="1028" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#516077" font-weight="400">Assessment implementation | Region, DNS, certificate, account roles and repository identity are deployment inputs.</text>
