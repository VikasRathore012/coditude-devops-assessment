<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect width="100%" height="100%" fill="#f2f5fa"/>
<text x="50" y="62" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#263750" font-weight="700">CODITUDE  /  AWS DEPLOYMENT ARCHITECTURE</text>
<text x="50" y="100" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#263750" font-weight="400">Two implementation options. Shared foundation. No live AWS deployment claimed.</text>
<rect x="50" y="135" width="360" height="125" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="172" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">Source and review</text>
<text x="70" y="204" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">GitHub + protected branches</text>
<text x="70" y="232" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Application / infrastructure paths</text>
<rect x="460" y="135" width="460" height="125" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="172" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">Infrastructure workflow</text>
<text x="480" y="204" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">CloudFormation change set → review</text>
<text x="480" y="232" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">Separate role and explicit apply</text>
<rect x="970" y="135" width="580" height="125" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="990" y="172" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#18314f" font-weight="700">Application delivery</text>
<text x="990" y="204" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">GitHub Actions OR CodePipeline + CodeBuild</text>
<text x="990" y="232" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#263750" font-weight="400">ECR digests / versioned S3 → app-only deployment</text>
<polyline points="410,174 460,174" fill="none" stroke="#546b87" stroke-width="3"/>
<polygon points="460,174 449.1946347717679,179.21958640933477 449.1946347717679,168.78041359066523" fill="#546b87"/>
