AWSTemplateFormatVersion: '2010-09-09'
Description: ec2 runtime; create after foundation and database bootstrap
Parameters:
  FoundationStack:
    Type: String
  Environment:
    Type: String
    AllowedValues:
    - dev
    - staging
    - prod
  CertificateArn:
    Type: String
    AllowedPattern: arn:aws[a-z-]*:acm:.*
  MinCapacity:
    Type: Number
    Default: 2
    MinValue: 2
  MaxCapacity:
    Type: Number
    Default: 6
    MinValue: 2
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.small
Conditions:
  IsProd:
    Fn::Equals:
    - Ref: Environment
    - prod
Resources:
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Vpc
      GroupDescription: HTTPS entrypoint; redirect HTTP
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 3000
        ToPort: 3000
        DestinationSecurityGroupId:
          Fn::ImportValue:
            Fn::Sub: ${FoundationStack}-ApplicationSG
      - IpProtocol: tcp
        FromPort: 8000
        ToPort: 8000
        DestinationSecurityGroupId:
          Fn::ImportValue:
            Fn::Sub: ${FoundationStack}-ApplicationSG
  FrontendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-ApplicationSG
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId:
        Ref: AlbSG
  FrontendTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Vpc
      Port: 3000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '30'
  BackendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-ApplicationSG
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId:
        Ref: AlbSG
  BackendTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Vpc
      Port: 8000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '30'
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Public1
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Public2
      SecurityGroups:
      - Ref: AlbSG
      LoadBalancerAttributes:
      - Key: deletion_protection.enabled
        Value:
          Fn::If:
          - IsProd
          - 'true'
          - 'false'
      - Key: routing.http.drop_invalid_header_fields.enabled
        Value: 'true'
  HTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
      - CertificateArn:
          Ref: CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
      - Type: forward
        TargetGroupArn:
          Ref: FrontendTarget
  HTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
      - Type: redirect
        RedirectConfig:
          Protocol: HTTPS
          Port: '443'
          StatusCode: HTTP_301
  APIRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: HTTPS
      Priority: 10
      Conditions:
      - Field: path-pattern
        Values:
        - /api/*
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: BackendTarget
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays:
        Fn::If:
        - IsProd
        - 90
        - 14
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  Errors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Application 5xx count > 10 in one minute
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - Alb
          - LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Alerts
      TreatMissingData: notBreaching
  FrontendUnhealthy:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - Alb
          - LoadBalancerFullName
      - Name: TargetGroup
        Value:
          Fn::GetAtt:
          - FrontendTarget
          - TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Alerts
      TreatMissingData: notBreaching
  BackendUnhealthy:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - Alb
          - LoadBalancerFullName
      - Name: TargetGroup
        Value:
          Fn::GetAtt:
          - BackendTarget
          - TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Alerts
      TreatMissingData: notBreaching
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RequiredAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::ImportValue:
                Fn::Sub: ${FoundationStack}-AppSecret
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:GetObjectVersion
            Resource:
              Fn::Join:
              - ''
              - - 'arn:'
                - Ref: AWS::Partition
                - ':s3:::'
                - Fn::ImportValue:
                    Fn::Sub: ${FoundationStack}-Artifacts
                - /releases/*
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::aws-codedeploy-${AWS::Region}/*
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            - logs:DescribeLogStreams
            Resource:
              Fn::GetAtt:
              - Logs
              - Arn
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - Ref: InstanceRole
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId:
          Ref: AmiId
        InstanceType:
          Ref: InstanceType
        IamInstanceProfile:
          Arn:
            Fn::GetAtt:
            - InstanceProfile
            - Arn
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: ${FoundationStack}-ApplicationSG
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub:
            - '#!/bin/bash

              set -euo pipefail

              dnf install -y python3.12 python3.12-pip nodejs22 nodejs22-npm ruby wget amazon-cloudwatch-agent

              useradd --system --create-home assessment || true

              mkdir -p /etc/assessment /var/log/assessment /opt/assessment

              cat > /etc/assessment/backend.env <<''ENV''

              APP_ENV=${Environment}

              AWS_DEFAULT_REGION=${AWS::Region}

              DB_HOST=${DBHost}

              DB_NAME=${DBName}

              DB_SECRET_ARN=${AppSecret}

              DB_CA_PATH=/opt/assessment/current/certs/global-bundle.pem

              ENV

              chmod 640 /etc/assessment/backend.env

              chown root:assessment /etc/assessment/backend.env

              cd /tmp

              wget -q https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install -O install-codedeploy

              chmod +x install-codedeploy

              ./install-codedeploy auto

              systemctl enable --now codedeploy-agent

              cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<''CW''

              {"logs":{"logs_collected":{"files":{"collect_list":[{"file_path":"/var/log/assessment/*.log","log_group_name":"${Logs}","log_stream_name":"{instance_id}","timezone":"UTC"}]}}}}

              CW

              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json

              '
            - DBHost:
                Fn::ImportValue:
                  Fn::Sub: ${FoundationStack}-DBHost
              DBName:
                Fn::ImportValue:
                  Fn::Sub: ${FoundationStack}-DBName
              AppSecret:
                Fn::ImportValue:
                  Fn::Sub: ${FoundationStack}-AppSecret
  Fleet:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Private1
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Private2
      MinSize:
        Ref: MinCapacity
      MaxSize:
        Ref: MaxCapacity
      DesiredCapacity:
        Ref: MinCapacity
      HealthCheckType: ELB
      HealthCheckGracePeriod: 900
      LaunchTemplate:
        LaunchTemplateId:
          Ref: LaunchTemplate
        Version:
          Fn::GetAtt:
          - LaunchTemplate
          - LatestVersionNumber
      TargetGroupARNs:
      - Ref: FrontendTarget
      - Ref: BackendTarget
      Tags:
      - Key: Name
        Value:
          Ref: AWS::StackName
        PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: false
  FleetScaling:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName:
        Ref: Fleet
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: codedeploy.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSCodeDeployRole
  DeploymentApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ComputePlatform: Server
  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName:
        Ref: DeploymentApplication
      ServiceRoleArn:
        Fn::GetAtt:
        - CodeDeployRole
        - Arn
      AutoScalingGroups:
      - Ref: Fleet
      DeploymentConfigName: CodeDeployDefault.OneAtATime
      DeploymentStyle:
        DeploymentType: IN_PLACE
        DeploymentOption: WITH_TRAFFIC_CONTROL
      LoadBalancerInfo:
        TargetGroupInfoList:
        - Name:
            Fn::GetAtt:
            - FrontendTarget
            - TargetGroupName
        - Name:
            Fn::GetAtt:
            - BackendTarget
            - TargetGroupName
      AutoRollbackConfiguration:
        Enabled: true
        Events:
        - DEPLOYMENT_FAILURE
        - DEPLOYMENT_STOP_ON_ALARM
      AlarmConfiguration:
        Enabled: true
        IgnorePollAlarmFailure: false
        Alarms:
        - Name:
            Ref: Errors
Outputs:
  LoadBalancerDNS:
    Value:
      Fn::GetAtt:
      - Alb
      - DNSName
  LoadBalancerZoneId:
    Value:
      Fn::GetAtt:
      - Alb
      - CanonicalHostedZoneID
  Logs:
    Value:
      Ref: Logs
  Mode:
    Value: ec2
  DeploymentApplication:
    Value:
      Ref: DeploymentApplication
  DeploymentGroup:
    Value:
      Ref: DeploymentGroup
  Fleet:
    Value:
      Ref: Fleet
