AWSTemplateFormatVersion: '2010-09-09'
Description: ecs runtime; create after foundation and database bootstrap
Parameters:
  FoundationStack:
    Type: String
  Environment:
    Type: String
    AllowedValues:
    - dev
    - staging
    - prod
  CertificateArn:
    Type: String
    AllowedPattern: arn:aws[a-z-]*:acm:.*
  MinCapacity:
    Type: Number
    Default: 2
    MinValue: 2
  MaxCapacity:
    Type: Number
    Default: 6
    MinValue: 2
  FrontendImage:
    Type: String
    AllowedPattern: .+@sha256:[a-f0-9]{64}
  BackendImage:
    Type: String
    AllowedPattern: .+@sha256:[a-f0-9]{64}
Conditions:
  IsProd:
    Fn::Equals:
    - Ref: Environment
    - prod
Resources:
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Vpc
      GroupDescription: HTTPS entrypoint; redirect HTTP
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 3000
        ToPort: 3000
        DestinationSecurityGroupId:
          Fn::ImportValue:
            Fn::Sub: ${FoundationStack}-ApplicationSG
      - IpProtocol: tcp
        FromPort: 8000
        ToPort: 8000
        DestinationSecurityGroupId:
          Fn::ImportValue:
            Fn::Sub: ${FoundationStack}-ApplicationSG
  FrontendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-ApplicationSG
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId:
        Ref: AlbSG
  FrontendTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Vpc
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '30'
  BackendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-ApplicationSG
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId:
        Ref: AlbSG
  BackendTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Vpc
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '30'
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Public1
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Public2
      SecurityGroups:
      - Ref: AlbSG
      LoadBalancerAttributes:
      - Key: deletion_protection.enabled
        Value:
          Fn::If:
          - IsProd
          - 'true'
          - 'false'
      - Key: routing.http.drop_invalid_header_fields.enabled
        Value: 'true'
  HTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
      - CertificateArn:
          Ref: CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
      - Type: forward
        TargetGroupArn:
          Ref: FrontendTarget
  HTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
      - Type: redirect
        RedirectConfig:
          Protocol: HTTPS
          Port: '443'
          StatusCode: HTTP_301
  APIRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: HTTPS
      Priority: 10
      Conditions:
      - Field: path-pattern
        Values:
        - /api/*
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: BackendTarget
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays:
        Fn::If:
        - IsProd
        - 90
        - 14
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  Errors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Application 5xx count > 10 in one minute
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - Alb
          - LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Alerts
      TreatMissingData: notBreaching
  FrontendUnhealthy:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - Alb
          - LoadBalancerFullName
      - Name: TargetGroup
        Value:
          Fn::GetAtt:
          - FrontendTarget
          - TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Alerts
      TreatMissingData: notBreaching
  BackendUnhealthy:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - Alb
          - LoadBalancerFullName
      - Name: TargetGroup
        Value:
          Fn::GetAtt:
          - BackendTarget
          - TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
      - Fn::ImportValue:
          Fn::Sub: ${FoundationStack}-Alerts
      TreatMissingData: notBreaching
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
      - Name: containerInsights
        Value: enabled
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  FrontendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RequiredAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: logs:PutLogEvents
            Resource:
              Fn::GetAtt:
              - Logs
              - Arn
  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RequiredAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::ImportValue:
                Fn::Sub: ${FoundationStack}-AppSecret
  FrontendTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub: ${AWS::StackName}-frontend
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
      - FARGATE
      ExecutionRoleArn:
        Fn::GetAtt:
        - ExecutionRole
        - Arn
      TaskRoleArn:
        Fn::GetAtt:
        - FrontendRole
        - Arn
      ContainerDefinitions:
      - Name: frontend
        Image:
          Ref: FrontendImage
        Essential: true
        PortMappings:
        - ContainerPort: 3000
          Protocol: tcp
        Environment:
        - Name: NODE_ENV
          Value: production
        LinuxParameters:
          InitProcessEnabled: true
        HealthCheck:
          Command:
          - CMD-SHELL
          - node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          Interval: 30
          Timeout: 5
          Retries: 3
          StartPeriod: 60
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: Logs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: frontend
  FrontendService:
    Type: AWS::ECS::Service
    Properties:
      Cluster:
        Ref: Cluster
      TaskDefinition:
        Ref: FrontendTask
      LaunchType: FARGATE
      DesiredCount:
        Ref: MinCapacity
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-Private1
          - Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-Private2
          SecurityGroups:
          - Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-ApplicationSG
      LoadBalancers:
      - TargetGroupArn:
          Ref: FrontendTarget
        ContainerName: frontend
        ContainerPort: 3000
    DependsOn:
    - HTTPS
    - APIRule
  FrontendScaling:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity:
        Ref: MinCapacity
      MaxCapacity:
        Ref: MaxCapacity
      ResourceId:
        Fn::Join:
        - /
        - - service
          - Ref: Cluster
          - Fn::GetAtt:
            - FrontendService
            - Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  FrontendScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName:
        Fn::Sub: ${AWS::StackName}-frontend-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId:
        Ref: FrontendScaling
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 180
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
  BackendTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub: ${AWS::StackName}-backend
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
      - FARGATE
      ExecutionRoleArn:
        Fn::GetAtt:
        - ExecutionRole
        - Arn
      TaskRoleArn:
        Fn::GetAtt:
        - BackendRole
        - Arn
      ContainerDefinitions:
      - Name: backend
        Image:
          Ref: BackendImage
        Essential: true
        PortMappings:
        - ContainerPort: 8000
          Protocol: tcp
        Environment:
        - Name: APP_ENV
          Value:
            Ref: Environment
        - Name: DB_HOST
          Value:
            Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-DBHost
        - Name: DB_NAME
          Value:
            Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-DBName
        - Name: DB_SECRET_ARN
          Value:
            Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-AppSecret
        LinuxParameters:
          InitProcessEnabled: true
        HealthCheck:
          Command:
          - CMD-SHELL
          - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"
          Interval: 30
          Timeout: 5
          Retries: 3
          StartPeriod: 60
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: Logs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: backend
  BackendService:
    Type: AWS::ECS::Service
    Properties:
      Cluster:
        Ref: Cluster
      TaskDefinition:
        Ref: BackendTask
      LaunchType: FARGATE
      DesiredCount:
        Ref: MinCapacity
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-Private1
          - Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-Private2
          SecurityGroups:
          - Fn::ImportValue:
              Fn::Sub: ${FoundationStack}-ApplicationSG
      LoadBalancers:
      - TargetGroupArn:
          Ref: BackendTarget
        ContainerName: backend
        ContainerPort: 8000
    DependsOn:
    - HTTPS
    - APIRule
  BackendScaling:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity:
        Ref: MinCapacity
      MaxCapacity:
        Ref: MaxCapacity
      ResourceId:
        Fn::Join:
        - /
        - - service
          - Ref: Cluster
          - Fn::GetAtt:
            - BackendService
            - Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  BackendScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName:
        Fn::Sub: ${AWS::StackName}-backend-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId:
        Ref: BackendScaling
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 180
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
Outputs:
  LoadBalancerDNS:
    Value:
      Fn::GetAtt:
      - Alb
      - DNSName
  LoadBalancerZoneId:
    Value:
      Fn::GetAtt:
      - Alb
      - CanonicalHostedZoneID
  Logs:
    Value:
      Ref: Logs
  Mode:
    Value: ecs
  FrontendService:
    Value:
      Fn::GetAtt:
      - FrontendService
      - Name
  FrontendTaskRole:
    Value:
      Fn::GetAtt:
      - FrontendRole
      - Arn
  BackendService:
    Value:
      Fn::GetAtt:
      - BackendService
      - Name
  BackendTaskRole:
    Value:
      Fn::GetAtt:
      - BackendRole
      - Arn
  Cluster:
    Value:
      Ref: Cluster
  ExecutionRole:
    Value:
      Fn::GetAtt:
      - ExecutionRole
      - Arn
